name: Verificação pública
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: URL pública do Streamlit (candidata ou produção)
        type: string
        default: https://smart-house-funcao16-pmsp.streamlit.app/
      manifesto_sha256:
        description: SHA-256 fixado do PUBLICO.json da edição v2026.11.16.3
        type: string
        default: bf5008688e6a046b551779022623f12f78e800e6933437062a13342056caae05
      sqlite:
        description: Download anônimo, hashes e controles SQL
        type: boolean
        default: true
      app:
        description: Renderizar e interagir com as seis trajetórias
        type: boolean
        default: false
      portal:
        description: Conferir navegação nas seis páginas do portal
        type: boolean
        default: false
      relatorios:
        description: Conferir portal, Looker Studio e destino Investigar
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - if: inputs.app || inputs.portal || inputs.relatorios
        run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - name: Executar controles selecionados
        env:
          APP_URL: ${{ inputs.app_url }}
          MANIFESTO_SHA256: ${{ inputs.manifesto_sha256 }}
          SQLITE: ${{ inputs.sqlite }}
          APP: ${{ inputs.app }}
          PORTAL: ${{ inputs.portal }}
          RELATORIOS: ${{ inputs.relatorios }}
        run: python verificar_publicacao.py
